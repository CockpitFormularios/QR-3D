<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Experience - Imagem 3D Flutuante</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #00ff00;
            padding: 10px 15px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            z-index: 200;
            font-size: 16px;
        }
        
        @media (max-width: 600px) {
            .loading { width: 80%; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="status">🔍 Iniciando AR...</div>
    <div id="info">✨ Imagem 3D Flutuante | Sempre olhando para você ✨</div>
    <div class="loading" id="loading">📷 Ativando câmera...<br>Aguarde</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        
        let scene, camera, renderer, floatingObject;
        let videoTexture;
        
        async function init() {
            // Configurar cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            
            // Ativar câmera do celular
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                
                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                
                const videoGeometry = new THREE.PlaneGeometry(4, 3);
                const videoMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, depthTest: false, depthWrite: false });
                const videoPlane = new THREE.Mesh(videoGeometry, videoMaterial);
                videoPlane.position.z = -2;
                videoPlane.scale.set(1.6, 1, 1);
                scene.add(videoPlane);
                
                document.getElementById('status').innerHTML = '✅ Câmera ativa | AR pronto';
                document.getElementById('loading').style.display = 'none';
                
                // Criar objeto flutuante
                createFloatingObject();
                
            } catch (err) {
                console.error('Erro:', err);
                document.getElementById('status').innerHTML = '❌ Erro: ' + err.message;
                document.getElementById('loading').innerHTML = '⚠️ Não foi possível acessar a câmera<br>Verifique as permissões';
            }
            
            // Luzes
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);
            const fillLight = new THREE.PointLight(0x4466cc, 0.5);
            fillLight.position.set(0, 1, 1);
            scene.add(fillLight);
            
            animate();
        }
        
        function createFloatingObject() {
            floatingObject = new THREE.Group();
            
            // Criar textura com imagem
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Fundo gradiente
            const grad = ctx.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, '#ff6b35');
            grad.addColorStop(1, '#ff3366');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            
            // Desenhar arte
            ctx.fillStyle = 'white';
            ctx.font = 'Bold 120px "Segoe UI Emoji"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🚀', 256, 200);
            
            ctx.font = 'Bold 45px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('AR EXPERIENCE', 256, 330);
            
            ctx.font = '30px Arial';
            ctx.fillStyle = '#ffff00';
            ctx.fillText('Olha pra voce!', 256, 410);
            
            // Bordas
            ctx.strokeStyle = 'gold';
            ctx.lineWidth = 8;
            ctx.strokeRect(15, 15, 482, 482);
            
            // Estrelinhas
            for(let i = 0; i < 50; i++) {
                ctx.fillStyle = `rgba(255,255,0,${Math.random()})`;
                ctx.fillRect(Math.random()*512, Math.random()*512, 3, 3);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshStandardMaterial({ 
                map: texture, 
                emissive: 0x442200,
                metalness: 0.3,
                roughness: 0.4
            });
            const geometry = new THREE.BoxGeometry(1.2, 1.2, 0.1);
            const cube = new THREE.Mesh(geometry, material);
            
            // Anel giratório
            const ringGeo = new THREE.TorusGeometry(0.9, 0.05, 32, 100);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff2200 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            floatingObject.add(cube);
            floatingObject.add(ring);
            
            scene.add(floatingObject);
            
            // Animação de flutuação
            let time = 0;
            function floatAnim() {
                if (floatingObject) {
                    time += 0.02;
                    floatingObject.position.y = Math.sin(time) * 0.2;
                    floatingObject.rotation.y = Math.sin(time * 0.5) * 0.5;
                    floatingObject.rotation.x = Math.sin(time * 0.7) * 0.3;
                    ring.rotation.z += 0.03;
                    ring.rotation.x = Math.sin(time * 0.5) * 0.5;
                }
                requestAnimationFrame(floatAnim);
            }
            floatAnim();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (videoTexture) {
                videoTexture.needsUpdate = true;
            }
            
            renderer.render(scene, camera);
        }
        
        // Iniciar
        init();
        
        // Prevenir zoom na página
        document.addEventListener('touchmove', function(e) {
            if (e.target === renderer.domElement) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
